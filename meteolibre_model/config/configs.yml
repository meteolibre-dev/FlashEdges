  model_type: "jit"
  model:
    sat_in_channels: 6      # GMGSI 4 + elevation 1
    kpi_in_channels: 7      # METAR 7 (p01m in dBZ)
    sat_out_channels: 6
    kpi_out_channels: 7
    context_frames: 4
    img_size: [7, 128, 128]
    patch_size: [1, 8, 8]
    embed_dim: 768
    depth: 12
    num_heads: 12
    context_dim: 6
    # --- adaLN conditioning (fine-tune recipe: exact no-op at resume) ---
    use_adaln: true
