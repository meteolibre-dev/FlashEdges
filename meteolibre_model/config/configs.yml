# v7 = v5 + adaLN(-Zero) conditioning: every DiT block gets a low-rank head
# regressing (shift, scale, gate) x2 from the shared timestep/context
# embedding, plus a (shift, scale) head on norm_final. The diffusion timestep
# is re-injected at EVERY block instead of one additive input bias diluted
# over the trunk (DiT ablations: adaLN-Zero > cross-attn > in-context >
# additive). Overhead: +~8.6M params (adaln_rank=128).
# FINE-TUNE recipe (values below): cond_additive keeps the legacy input bias
# and adaln_gate_init=1.0 makes every new head an EXACT identity at init ->
# resuming a pre-adaLN checkpoint (strict=False) reproduces its outputs
# bit-for-bit while the adaLN heads learn on top.
# SCRATCH recipe: cond_additive: false + adaln_gate_init: 0.0 (canonical
# adaLN-Zero: blocks start as identity; conditioning flows only via the heads).
model_v7_global_satellite_metar:
  log_every_n_steps: 5
  save_every_n_epochs: 1
  model_dir: "models/"
  parametrization: "standard"
  interpolation: "linear"
  batch_size: 64
  learning_rate: 0.00001
  num_epochs: 500
  seed: 42
  sigma_noise_input: 10.0
  gradient_clip_value: 1.0
  residual: false
  dataset_path: "."
  metar_loss_weight: 1.
  model_type: "jit"
  model:
    sat_in_channels: 6      # GMGSI 4 + raar + elevation 1
    kpi_in_channels: 7      # METAR 7 (p01m in dBZ)
    sat_out_channels: 6
    kpi_out_channels: 7
    context_frames: 4
    img_size: [7, 128, 128]
    patch_size: [1, 8, 8]
    embed_dim: 768
    depth: 12
    num_heads: 12
    context_dim: 6
    # --- adaLN conditioning (fine-tune recipe: exact no-op at resume) ---
    use_adaln: true
    cond_additive: true
    adaln_rank: 128
    adaln_gate_init: 1.0

# v8 = v4 + adaLN(-Zero) conditioning -- SAME as v7 but for the 12-channel
# checkpoint lineage (sat_in=5: GMGSI 4 + elevation, no raar), i.e. the
# checkpoint_21aug_prettygood / checkpoint_base17aug / peftfine family.
# Use THIS when resuming from those safetensors; use v7 for the sat_in=6
# (v5/v6, raar) lineage. Fine-tune recipe identical to v7 (exact no-op at
# resume: gate_init=1.0 + cond_additive=true).
model_v8_global_satellite_metar:
  log_every_n_steps: 5
  save_every_n_epochs: 1
  model_dir: "models/"
  parametrization: "standard"
  interpolation: "linear"
  batch_size: 64
  learning_rate: 0.00001
  num_epochs: 500
  seed: 42
  sigma_noise_input: 10.0
  gradient_clip_value: 1.0
  residual: false
  dataset_path: "."
